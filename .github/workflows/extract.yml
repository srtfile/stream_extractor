name: Extract Stream URLs

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'JSON-encoded array of streaming URLs'
        required: true
        type: string
      run_id:
        description: 'Unique run identifier for polling'
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Write URLs to file
        env:
          URLS_JSON: ${{ github.event.inputs.urls }}
        run: |
          python3 - <<'PY'
          import json, os
          raw = os.environ["URLS_JSON"]
          urls = json.loads(raw)
          with open("_input_urls.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(urls))
          PY

      - name: Run extractor
        run: python3 extract.py _input_urls.txt results.json '${{ github.event.inputs.run_id }}'

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --cached --quiet || git commit -m "chore: stream extraction results [${{ github.event.inputs.run_id }}]"
          git push
