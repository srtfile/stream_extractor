name: Extract Stream URLs

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'JSON-encoded array of streaming URLs'
        required: true
        type: string
      run_id:
        description: 'Unique run identifier for polling'
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect Dood URLs
        id: detect_hosts
        env:
          URLS_JSON: ${{ github.event.inputs.urls }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          hosts = ("dood", "doods", "d000d", "d0000d", "do0od", "ds2play",
                   "ds2video", "vidply", "playmogo")
          urls = json.loads(os.environ.get("URLS_JSON", "[]"))
          needs = any(any(h in u.lower() for h in hosts) for u in urls)
          print(f"dood={'true' if needs else 'false'}")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install browser fallback for Dood
        if: steps.detect_hosts.outputs.dood == 'true'
        run: python -m playwright install chromium

      - name: Set up WARP for Dood hosts
        if: steps.detect_hosts.outputs.dood == 'true'
        uses: fscarmen/warp-on-actions@v1.4
        continue-on-error: true
        with:
          stack: ipv4
          mode: client

      - name: Write URLs to file
        env:
          URLS_JSON: ${{ github.event.inputs.urls }}
        run: |
          python3 - <<'PY'
          import json, os
          raw = os.environ["URLS_JSON"]
          urls = json.loads(raw)
          with open("_input_urls.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(urls))
          PY

      - name: Run extractor
        run: python3 extract.py _input_urls.txt results.json '${{ github.event.inputs.run_id }}'

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --cached --quiet || git commit -m "chore: stream extraction results [${{ github.event.inputs.run_id }}]"
          git push
